<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://*.turso.io https://api.github.com; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<title>LinkedIn Radar</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%230a66c2'/%3E%3Ccircle cx='16' cy='16' r='8' fill='none' stroke='white' stroke-width='2.5'/%3E%3Ccircle cx='16' cy='16' r='2.5' fill='white'/%3E%3C/svg%3E">
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="top">
  <a class="brand" href="#/feed"><span class="logo" aria-hidden="true"></span>LinkedIn Radar</a>
  <nav id="nav" aria-label="Sections">
    <a href="#/feed" data-route="feed">Feed</a>
    <a href="#/people" data-route="people">People</a>
    <a href="#/searches" data-route="searches">Searches</a>
    <a href="#/runs" data-route="runs">Runs &amp; sources</a>
    <a href="#/settings" data-route="settings">Settings</a>
  </nav>
  <div id="status" class="status" aria-live="polite" title="Refresh"></div>
  <button id="lock" class="lockbtn" hidden title="Lock the radar on this device">🔒 Lock</button>
</header>
<main id="view" tabindex="-1"><p class="muted pad">Loading…</p></main>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script src="app.js"></script>
</body>
</html>
